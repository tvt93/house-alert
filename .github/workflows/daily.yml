name: daily digest

on:
  schedule:
    # Times are UTC. Brussels is UTC+1 in winter, UTC+2 in summer.
    - cron: "0 23 * * *"    # around midnight: refresh the page
    - cron: "15 6 * * *"    # morning: refresh and send the mails
    - cron: "0 11 * * *"    # around noon: refresh the page
  workflow_dispatch:
    inputs:
      send_mail:
        description: "Also send the mails (otherwise new listings stay queued for the morning mail)"
        type: boolean
        default: false
      dry_run:
        description: "Scan and report only - send no email, save no state"
        type: boolean
        default: false

# The run commits the updated state and the site data back to the repo;
# GitHub Pages then redeploys docs/ on its own.
permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e .

      - name: Scan, re-check, locate, email, export
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          # Every secret, so a subscription can name any "$MAIL_TO_..." secret
          # without this file having to list it.
          HOUSE_ALERT_SECRETS: ${{ toJSON(secrets) }}
          HOUSE_ALERT_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          # Only the 06:15 run (or a manual run that asks for it) sends mail.
          NO_EMAIL: ${{ ((github.event_name == 'schedule' && github.event.schedule != '15 6 * * *') || (github.event_name == 'workflow_dispatch' && !inputs.send_mail)) && '--no-email' || '' }}
        run: |
          house-alert -v run \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            $NO_EMAIL \
            --out digest.html

      - name: Upload the rendered digest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_number }}
          path: digest.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit updated state and site data
        if: ${{ !inputs.dry_run }}
        run: |
          if git diff --quiet -- state/ docs/listings.json; then
            echo "nothing changed"
            exit 0
          fi
          git config user.name  "house-alert[bot]"
          git config user.email "house-alert@users.noreply.github.com"
          git add state/ docs/listings.json
          git commit -m "chore(state): listings as of $(date -u '+%F %H:%M') UTC"
          # If something else touched the state meanwhile, the freshest scan
          # (this one) wins; the files are regenerated every run anyway.
          if ! git pull --rebase; then
            git checkout --theirs -- state/ docs/listings.json
            git add state/ docs/listings.json
            GIT_EDITOR=true git rebase --continue
          fi
          git push
