name: daily mail from an issue

# The overview page's "Dagelijkse mail" dialog opens a prefilled issue, both
# to set up a mail ("Dagelijkse mail: <name>") and to stop one ("Dagelijkse
# mail stoppen: <name>"). This turns the first into config/subscriptions/
# <name>.yaml and removes the file for the second, rewrites the page's
# overview (docs/subscriptions.json), commits and closes the issue with a
# note. Addresses in the issue are sealed (enc:...); only this run and the
# mail run can read them, with the MAIL_KEY secret. Stopping is only honoured
# when the sealed address in the issue is that mail's recipient.

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

# Shares the daily run's group so the two never commit at the same time.
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  subscribe:
    if: startsWith(github.event.issue.title, 'Dagelijkse mail')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ISSUE: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e .

      - name: Write or remove the subscription file
        id: write
        env:
          BODY: ${{ github.event.issue.body }}
          # Needed to check, when stopping a mail, that the address in the
          # issue is the one the mail goes to. The issue body is only parsed
          # as data; nothing in it is executed or echoed back.
          MAIL_KEY: ${{ secrets.MAIL_KEY }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_TO_PARTNER: ${{ secrets.MAIL_TO_PARTNER }}
          MAIL_TO_2: ${{ secrets.MAIL_TO_2 }}
          MAIL_TO_3: ${{ secrets.MAIL_TO_3 }}
        run: |
          printf '%s' "$BODY" > /tmp/issue-body.md
          set +e
          house-alert subscribe-from-issue --body-file /tmp/issue-body.md > /tmp/result.txt
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          {
            echo 'message<<EOF'
            cat /tmp/result.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          cat /tmp/result.txt

      - name: Commit the change
        if: steps.write.outputs.code == '0'
        env:
          ACTION: ${{ steps.write.outputs.action }}
        run: |
          git config user.name  "house-alert[bot]"
          git config user.email "house-alert@users.noreply.github.com"
          git add config/subscriptions/ docs/subscriptions.json
          if [ "$ACTION" = "unsubscribe" ]; then
            git commit -m "Dagelijkse mail gestopt vanaf de pagina (#$ISSUE)"
          else
            git commit -m "Dagelijkse mail ingesteld vanaf de pagina (#$ISSUE)"
          fi
          git pull --rebase
          git push

      - name: Confirm on the issue
        if: steps.write.outputs.code == '0'
        env:
          ACTION: ${{ steps.write.outputs.action }}
        run: |
          if [ "$ACTION" = "unsubscribe" ]; then
            gh issue comment "$ISSUE" --body "Gestopt. Deze mail komt niet meer. Een nieuwe instellen kan altijd via de knop Dagelijkse mail op de overzichtspagina."
          else
            gh issue comment "$ISSUE" --body "Ingesteld. Vanaf morgenochtend komt deze mail, telkens er nieuwe woningen zijn die aan de filters voldoen. Stoppen kan later via Dagelijkse mail > Bestaande mails op de overzichtspagina."
          fi
          gh issue close "$ISSUE" --reason completed

      - name: Explain the refusal on the issue
        if: steps.write.outputs.code == '3'
        env:
          WHY: ${{ steps.write.outputs.message }}
        run: |
          gh issue comment "$ISSUE" --body "Dit kon niet uitgevoerd worden: $WHY. Probeer het opnieuw via de knop Dagelijkse mail op de overzichtspagina."
          gh issue close "$ISSUE" --reason "not planned"
