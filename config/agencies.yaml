# Registry of estate agencies to scan.
#
#   name:     display name, shown in the email as the listing source
#   url:      site root (no trailing slash)
#   region:   free-form tag, used only for grouping/filtering (gent | kortrijk)
#   platform: which scraper to use. "auto" = the generic sitemap + JSON-LD
#             scraper. Run `house-alert detect` to fill this in with a concrete
#             platform (whise / sweepbright / omnicasa / skarabee) where one is
#             recognised - those expose real APIs and are far more reliable
#             than HTML scraping.
#   enabled:  set false to skip an agency without deleting the entry
#
# Seeded from sprokkel.be (Gent city, Gent region, Kortrijk region), Aug 2026.
# Adding an agency is one entry here - no code change needed.

defaults:
  platform: auto
  enabled: true

