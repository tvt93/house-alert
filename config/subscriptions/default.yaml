# One file here = one daily email. Copy this file to add another recipient
# with different filters; delete it to stop that mail. The overview page can
# write these files for you: see the "Dagelijkse mail" button.
#
# Every filter is optional: leave a field blank (or delete it) and that check
# is skipped entirely. `house-alert run --dry-run -v` prints what matched and
# what was filtered out, and why.

name: Standaard

# Recipients. "$NAME" reads the address from an environment variable or a
# GitHub Actions secret of that name, so the address itself never sits in the
# repository. The workflow knows MAIL_TO, MAIL_TO_PARTNER, MAIL_TO_2 and
# MAIL_TO_3. A plain address also works, but remember this repo is public.
to:
  - $MAIL_TO

enabled: true

property_types:          # matched against the listing's detected type
  - house
  # - apartment
  # - land
  # - commercial

price:
  min:                   # e.g. 200000
  max:                   # e.g. 450000
  # Listings with no detectable price ("prijs op aanvraag") are controlled by:
  include_unknown: true

bedrooms:
  min:                   # e.g. 3
  max:
  include_unknown: true

living_area_m2:          # habitable surface (bewoonbare oppervlakte)
  min:                   # e.g. 120
  max:
  include_unknown: true

plot_area_m2:            # total land area (grondoppervlakte)
  min:
  max:
  include_unknown: true

epc:
  # Max EPC score in kWh/m2/yr. Lower is better. Flanders labels: A <=100,
  # B <=200, C <=300, D <=400, E <=500, F >500.
  max_kwh:
  include_unknown: true

# Postcodes: exact ("9000") or a prefix ("90" = everything from 9000 to
# 9099). Empty = any. A listing whose postcode could not be read is rejected
# by this filter, so leave it empty if that worries you and use municipalities.
postcodes: []
  # - "9000"
  # - "9030"
  # - "85"

# Municipality filter. Case-insensitive substring match against the listing's
# address/city. Leave the list empty to accept the whole scan area.
municipalities:
  include: []
    # - Gent
    # - Gentbrugge
    # - Sint-Amandsberg
    # - Drongen
    # - Merelbeke
    # - Deinze
    # - Kortrijk
    # - Kuurne
    # - Harelbeke
    # - Zwevegem
  exclude: []

# Words that, if present in the title or description, reject the listing
# outright. Useful for filtering out categories the type detection misses.
exclude_keywords:
  - garagebox
  - staanplaats
  - parkeerplaats
  - opbrengsteigendom
  - nieuwbouwproject
  - handelspand

# Words that, if present, are shown as a tag on the card in the email.
# Purely additive - never overrides price/type filters.
highlight_keywords:
  - tuin
  - zuidgericht
  - te renoveren
